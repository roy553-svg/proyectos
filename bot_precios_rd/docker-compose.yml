services:
  bot-precios-rd:
    build: .
    container_name: bot-precios-rd
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Santo_Domingo
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
