# =============================================================================
#  canton.conf  -  Topologia local del PoC bancario
#
#  Un sincronizador (secuenciador + mediador) y CUATRO nodos participantes
#  totalmente aislados entre si:
#
#      bancoAlfa      Banco emisor        ledger-api 5011 / json 5013
#      bancoBeta      Banco receptor      ledger-api 5021 / json 5023
#      bancoGamma     Tercero no implicado ledger-api 5031 / json 5033
#      bancoCentral   Regulador (solo lectura) ledger-api 5041 / json 5043
#
#  Cada participante mantiene SU PROPIO almacen de contratos. El secuenciador
#  ordena y entrega sobres cifrados; no puede leer su contenido. El mediador
#  agrega confirmaciones sin ver los payloads. Esa es la diferencia estructural
#  con una blockchain de estado global replicado.
#
#  Almacenamiento en memoria: pensado para demo. En produccion cada nodo usa
#  su propio PostgreSQL y sus claves en un HSM/KMS.
# =============================================================================

canton {

  # ---------------------------------------------------------------------------
  # Sincronizador: secuenciador
  # ---------------------------------------------------------------------------
  sequencers {
    sequencerInterbancario {
      storage.type = "memory"

      # Puerto por el que los participantes envian y reciben sobres cifrados.
      public-api {
        port = 5001
      }
      admin-api {
        port = 5002
      }

      sequencer {
        # "reference": secuenciador monolitico para desarrollo. En produccion
        # se sustituye por un secuenciador BFT distribuido entre operadores.
        type = "reference"
        config {
          storage.type = "memory"
        }
      }
    }
  }

  # ---------------------------------------------------------------------------
  # Sincronizador: mediador
  # ---------------------------------------------------------------------------
  mediators {
    mediadorInterbancario {
      storage.type = "memory"
      admin-api {
        port = 5007
      }
    }
  }

  # ---------------------------------------------------------------------------
  # Nodos participantes: un ledger privado por institucion
  # ---------------------------------------------------------------------------
  participants {

    bancoAlfa {
      storage.type = "memory"
      admin-api.port = 5012
      ledger-api {
        port = 5011
        user-management-service.enabled = true
      }
      # API JSON v2: es la que consume el frontend ejecutivo.
      http-ledger-api.port = 5013
    }

    bancoBeta {
      storage.type = "memory"
      admin-api.port = 5022
      ledger-api {
        port = 5021
        user-management-service.enabled = true
      }
      http-ledger-api.port = 5023
    }

    bancoGamma {
      storage.type = "memory"
      admin-api.port = 5032
      ledger-api {
        port = 5031
        user-management-service.enabled = true
      }
      http-ledger-api.port = 5033
    }

    bancoCentral {
      storage.type = "memory"
      admin-api.port = 5042
      ledger-api {
        port = 5041
        user-management-service.enabled = true
      }
      http-ledger-api.port = 5043
    }
  }
}
