# =============================================================================
#  Canton Banking PoC — Libro de transacciones segregado por institución
#  Daml SDK 3.4.11 (Canton 3.4) — Daml-LF 2.1
# =============================================================================
sdk-version: 3.4.11
name: canton-banking-poc
version: 1.0.0
source: daml

# Script de inicialización que se ejecuta con `daml start` / `daml script`.
init-script: BankLedger:demoCompleta

# Partes que Canton debe pre-asignar cuando se usa el sandbox de desarrollo.
parties:
  - BancoAlfa
  - BancoBeta
  - BancoGamma
  - BancoCentral

dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script

build-options:
  # Advierte si una actualización rompe la compatibilidad de interfaces (SCU).
  - -Wupgrade-interfaces
  - -Wupgrade-exceptions
  # Trata las advertencias del modelo como información explícita en el build.
